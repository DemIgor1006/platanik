<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
</head>
<body>
<title>PLATANIK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="PLATANIK — запчастини, аксесуари, світлотехніка та пневматика для вантажівок і причепів від ТОВ «ПЛА-ТАН І К». Склади в Києві та Харкові.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* legacy layer: styles of screens not yet regenerated from Figma */

/* Layout: black nav bar → #191919 action bar (catalog pill + search) → page on light grey with white 16px-radius cards;
   home hero sits on a dark carbon band (catalog sidebar · banner slider · promo card) → yellow (#ffd004) is the only accent → black footer.
   Type: Inter 500/600 everywhere, as in the PLATANIK Figma; codes in Inter tabular figures. */
:root {
  --bg: #f2f2f2; --surface: #ffffff; --soft: #f5f5f5; --line: #e5e5e5; --line-2: #d9d9d9;
  --ink: #0b0b0b; --ink-2: #333638; --muted: #828a8d; --faint: #aaaaaa;
  --accent: #ffd004; --accent-hover: #ffdc3d; --accent-ink: #0b0b0b; --accent-text: #a07c00; --accent-soft: #fff8d6;
  --ok: #00a14b; --ok-soft: #e6f6ec; --danger: #e30613; --danger-soft: #fbe5e5; --warn-soft: #fffbe6;
  --chrome: #000000; --chrome-2: #191919; --chrome-3: #262626; --chrome-ink: #ffffff; --chrome-muted: #9a9ea0; --chrome-line: #333333;
  --photo: #ffffff; --skeleton: #ececec; --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 2px 6px rgba(0, 0, 0, .05), 0 12px 32px rgba(0, 0, 0, .08);
  --f-body: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 16px; --r-sm: 8px; --wrap: 1600px;
}



* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--chrome); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
img:not([src]) { visibility: hidden; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1280px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.ico { width: 24px; height: 24px; flex: none; display: block; }
.ico.s { width: 18px; height: 18px; } .ico.xs { width: 16px; height: 16px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 100px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; line-height: 1; padding: 14px 24px; white-space: nowrap; transition: background .15s, box-shadow .15s; }
.btn:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--accent-text); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.dark { background: var(--chrome-2); color: #fff; }
.btn.line { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.line:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.btn.sm { padding: 10px 16px; font-size: 14px; }
.btn.lg { padding: 17px 32px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: default; }
.ibtn { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: var(--r-sm); border: 0; background: var(--accent); color: var(--accent-ink); flex: none; transition: background .15s, transform .1s; }
.ibtn:hover { background: var(--accent-hover); }
.ibtn:active { transform: scale(.96); }
.ibtn.in { background: var(--chrome-2); color: var(--accent); }
.ibtn.off { background: var(--soft); color: var(--muted); }
.ibtn.sm { width: 40px; height: 40px; }
.link { color: var(--accent-text); font-weight: 600; background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.heart { background: none; border: 0; padding: 4px; color: var(--muted); display: inline-grid; place-items: center; border-radius: 50%; }
.heart:hover { color: var(--ink); }
.heart.on { color: var(--danger); }
.heart.on svg path { fill: currentColor; }

/* ===== page bits ===== */
main { min-height: 50vh; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding-block: 20px 12px; }
.crumbs a:hover { color: var(--ink); }
.crumbs .sep { opacity: .6; }
.ptitle { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 20px; }
.ptitle h1 { font-size: clamp(24px, 2.4vw, 32px); }
.card { background: var(--surface); border-radius: var(--r); }
.sec { padding-block: 32px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.sec-h h2 { font-size: clamp(22px, 2vw, 28px); }
.sec-h .more { font-size: 14px; color: var(--accent-text); font-weight: 600; }
.pager { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 100px; padding: 4px 6px; box-shadow: inset 0 0 0 1px var(--line); }
.pager button { background: none; border: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.pager button:hover { background: var(--soft); }
.pager button[disabled] { opacity: .3; }
.pager .dots { display: inline-flex; gap: 6px; }
.pager .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line-2); transition: width .2s, background .2s; }
.pager .dots i.on { width: 6px; background: var(--accent); }

/* composed banners (built from real catalogue photos) */
.bn { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 12px; padding: 48px 56px 64px; height: 100%; color: #fff; overflow: hidden; }
.bn .eb { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
.bn h2 { font-size: clamp(28px, 3vw, 44px); font-weight: 700; line-height: 1.08; letter-spacing: -.02em; text-transform: uppercase; }
.bn p { color: #c9c9c9; margin-top: 14px; max-width: 42ch; font-size: 15.5px; }
.bn .btn { margin-top: 28px; background: #fff; color: #000; }
.bn .btn:hover { background: var(--accent); }
.bn .pics { position: relative; height: 100%; min-height: 300px; }
.bn .pics span { position: absolute; display: grid; place-items: center; background: #fff; border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.45); overflow: hidden; }
.bn .pics span img { max-width: 92%; max-height: 92%; object-fit: contain; }
.bn .pics span:nth-child(1) { width: 62%; aspect-ratio: 1; right: 4%; top: 2%; transform: rotate(3deg); }
.bn .pics span:nth-child(2) { width: 44%; aspect-ratio: 1; left: 0; bottom: 4%; transform: rotate(-5deg); }
.bn .pics span:nth-child(3) { width: 34%; aspect-ratio: 1; right: 0; bottom: 0; transform: rotate(6deg); }
.bn.y { background: radial-gradient(90% 120% at 100% 0%, #3a3000 0%, #121212 55%); }
.bn.y h2 em { font-style: normal; color: var(--accent); }
.bn.r { background: radial-gradient(90% 120% at 100% 100%, #3d0d10 0%, #121212 55%); }
.bn.g { background: radial-gradient(90% 120% at 0% 100%, #2b2b2b 0%, #101010 60%); }
.promo { border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; min-height: 528px; }
.promo .ptag { display: flex; gap: 4px; flex-wrap: wrap; }
.promo .ptag span { background: var(--accent); color: #000; font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
.promo .pph { flex: 1; display: grid; place-items: center; background: var(--photo); border-radius: 12px; min-height: 200px; }
.promo .pph img { max-height: 240px; object-fit: contain; }
.promo .pn { font-size: 15px; line-height: 1.4; }
.promo .pp { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.promo .pp b { font-size: 22px; }
.benefits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 32px; padding-inline: 0; }
.benefit { display: flex; gap: 20px; align-items: center; padding: 24px; border-radius: var(--r); background: rgba(38, 38, 38, .85); }
.benefit .bi { width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: #000; display: grid; place-items: center; flex: none; }
.benefit b { display: block; font-size: 17px; color: var(--accent); margin-bottom: 6px; }
.benefit span { font-size: 14px; color: #d6d6d6; line-height: 1.45; }

/* product page */
.prod { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) 380px; gap: 16px; align-items: start; }
.gal { padding: 24px; display: grid; gap: 16px; }
.gal .main { aspect-ratio: 1; background: var(--photo); border-radius: 12px; display: grid; place-items: center; overflow: hidden; }
.gal .main img { width: 100%; height: 100%; object-fit: contain; }
.gal .thumbs { display: flex; gap: 12px; justify-content: center; align-items: center; }
.gal .thumbs button.t { width: 64px; height: 64px; border-radius: 10px; border: 1.5px solid transparent; background: var(--photo); padding: 3px; display: grid; place-items: center; overflow: hidden; }
.gal .thumbs button.t[aria-pressed="true"] { border-color: var(--accent); }
.gal .thumbs button.t img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pinfo { padding: 24px; display: grid; gap: 20px; align-content: start; }
.pinfo .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.pinfo h1 { font-size: clamp(22px, 1.9vw, 28px); line-height: 1.3; }
.pinfo .bcard { width: 132px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 6px; justify-items: center; font-size: 12px; font-weight: 600; text-align: center; }
.pinfo .bcard .lg { width: 100px; height: 64px; display: grid; place-items: center; background: #fff; border-radius: 8px; overflow: hidden; }
.pinfo .bcard .lg img { max-width: 96px; max-height: 60px; object-fit: contain; }
.pinfo .bcard .lg b { color: #333; font-size: 14px; }
.kv { display: flex; flex-wrap: wrap; gap: 8px 32px; font-size: 14px; }
.kv div { display: grid; gap: 2px; }
.kv small { color: var(--muted); font-size: 12.5px; }
.whs { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: 6px 40px; font-size: 14px; }
.whs span small { color: var(--muted); margin-left: 4px; }
.bigprice { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bigprice small { font-size: 18px; }
.bigprice s { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 10px; }
.pbuy { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.pbuy .btn { min-width: 200px; padding-block: 16px; }
.qty { display: inline-grid; grid-template-columns: 36px 48px 36px; height: 44px; border: 1px solid var(--line-2); border-radius: 100px; overflow: hidden; background: var(--surface); }
.qty button { border: 0; background: none; font-size: 18px; color: var(--muted); }
.qty button:hover { color: var(--ink); }
.qty input { border: 0; text-align: center; width: 100%; min-width: 0; background: transparent; font-weight: 600; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty.sm { grid-template-columns: 30px 40px 30px; height: 38px; }
.side-info { padding: 8px 20px; }
.si { padding-block: 16px; display: grid; gap: 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.si:first-child { border-top: 0; }
.si .sih { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 600; font-size: 14.5px; }
.si .sih .ico { color: var(--accent-text); }
.si .sih a { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
.si em { font-style: normal; color: var(--accent-text); font-weight: 600; }
.si ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; color: var(--ink); }
.si li { display: flex; gap: 10px; align-items: center; }
.si li i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 800; color: #fff; flex: none; }
.ptabs { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.tabs { padding: 8px 24px 24px; }
.tabs [role="tablist"] { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin-bottom: 20px; }
.tabs [role="tab"] { background: none; border: 0; padding: 16px 16px 14px; font-size: 14.5px; color: var(--muted); white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
.tabs [role="tab"][aria-selected="true"] { color: var(--accent-text); box-shadow: inset 0 -2px 0 var(--accent); }
.tabs h3 { font-size: 17px; margin: 4px 0 10px; }
.tabs .desc { color: var(--ink-2); max-width: 75ch; line-height: 1.6; font-weight: 400; display: grid; gap: 10px; }
.chars { display: grid; gap: 10px; max-width: 560px; font-size: 14px; }
.chars div { display: flex; align-items: baseline; gap: 8px; }
.chars span:first-child { color: var(--muted); }
.chars i { flex: 1; border-bottom: 1px dotted var(--line-2); transform: translateY(-4px); }
.side-ban { border-radius: var(--r); overflow: hidden; min-height: 300px; display: grid; }
.side-ban .bn { grid-template-columns: 1fr; padding: 28px; gap: 8px; align-content: start; }
.side-ban .bn .pics { min-height: 220px; }
.rev { display: grid; gap: 14px; }
.rev .ri { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.stars { display: inline-flex; gap: 2px; color: var(--accent); }
.stars button { background: none; border: 0; padding: 0; color: var(--line-2); font-size: 22px; line-height: 1; }
.stars button.on { color: var(--accent); }

/* forms */
.fld { display: grid; gap: 6px; }
.fld label { font-size: 13.5px; color: var(--muted); }
.fld label i { color: var(--danger); font-style: normal; }
.fld input, .fld select, .fld textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 14px; background: var(--surface); font-size: 15px; font-weight: 500; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 208, 4, .3); }
.fld .err { color: var(--danger); font-size: 12.5px; }
.fld.bad input, .fld.bad select { border-color: var(--danger); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.radio-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 14.5px; cursor: pointer; }
.radio-row:first-of-type { border-top: 0; }
.radio-row input { accent-color: var(--accent); width: 18px; height: 18px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 100px; padding: 10px 16px; font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* cart */
.note { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--warn-soft); border: 1px solid #f0d966; border-radius: 12px; padding: 14px 16px; font-size: 13.5px; margin-bottom: 16px; }
.note button { background: none; border: 0; color: var(--muted); }
.cart-l { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.cl .ch { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 16px; gap: 12px; }
.cl .ch h2 { font-size: 18px; }
.cl .ch h2 small { color: var(--muted); font-weight: 500; font-size: 13px; }
.cl .th, .cl .tr { display: grid; grid-template-columns: 76px minmax(0, 2.4fr) minmax(0, 1fr) 150px 130px 110px 36px; gap: 14px; align-items: center; padding: 12px 20px; }
.cl .th { background: var(--soft); font-size: 12px; color: var(--muted); }
.cl .tr { border-top: 1px solid var(--line); font-size: 13.5px; }
.cl .tr .tph { width: 64px; height: 64px; background: var(--photo); border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.cl .tr .tph img { max-width: 60px; max-height: 60px; object-fit: contain; }
.cl .tr small { display: block; color: var(--muted); }
.cl .tr select { border: 1px solid var(--line-2); border-radius: 100px; padding: 8px 12px; background: var(--surface); font-size: 13px; width: 100%; }
.cl .tr select:focus { border-color: var(--accent); outline: none; }
.cl .tr .rm { background: none; border: 0; color: var(--muted); padding: 4px; }
.cl .tr .rm:hover { color: var(--danger); }
.cl .cf { display: flex; justify-content: flex-end; align-items: center; gap: 20px; padding: 16px 20px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.cl .cf span { color: var(--muted); }
.cl .cf b { font-size: 18px; }
.csum { padding: 20px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); }
.csum h3 { font-size: 18px; }
.csum .w small { color: var(--muted); font-size: 12.5px; display: block; }
.csum .w b { font-variant-numeric: tabular-nums; }
.csum .tot { border-top: 1px solid var(--line); padding-top: 14px; }
.csum .tot b { font-size: 26px; }
.co { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 620px); gap: 16px; align-items: start; }
.co .box { padding: 24px; display: grid; gap: 16px; }
.co .box h2 { font-size: 18px; }
.co .box hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.co .items .it { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
.co .items .it:first-of-type { border-top: 0; }
.co .items .it .tph { width: 52px; height: 52px; background: var(--photo); border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.co .items .it .tph img { max-width: 48px; max-height: 48px; object-fit: contain; }
.co .items .it small { color: var(--muted); display: block; }
.co .items .it .r { text-align: right; white-space: nowrap; }
.co .total { background: var(--line); border-radius: var(--r); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.co .total b { font-size: 24px; font-variant-numeric: tabular-nums; }
.done-box { padding: 32px; display: grid; gap: 16px; max-width: 860px; }
.done-box .okc { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.done-box h1 { font-size: 28px; }
.done-box pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); border-radius: 12px; padding: 16px; font: 500 13px/1.6 ui-monospace, Menlo, Consolas, monospace; margin: 0; max-height: 380px; overflow: auto; }
.done-box .row { display: flex; flex-wrap: wrap; gap: 10px; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 200; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadein .15s ease; }
.modal > div { background: var(--surface); border-radius: 20px; width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.modal .mh { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 8px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
.modal .mh h2 { font-size: 20px; }
.modal .mh h2 small { color: var(--muted); font-size: 13px; font-weight: 500; }
.modal .mh button { background: none; border: 0; color: var(--muted); padding: 6px; }
.modal .mb { padding: 8px 24px 24px; display: grid; gap: 16px; }
.mline { display: grid; grid-template-columns: 64px minmax(0, 1fr) 30px; gap: 14px; padding-block: 14px; border-bottom: 1px solid var(--line); }

/* PLATANIK storefront. Sizes, colours and type come from the Figma file (generated blocks below are produced by tools/build_css.py from src/maps/*.txt);
   hand-written blocks add states, fluid behaviour between the 1920 and 390 frames, and things the mock-up does not cover. */
:root {
  --f: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --bg: #f2f2f2; --surface: #ffffff; --line: #e5e5e5; --ink: #000000; --muted: #828a8d; --faint: #aaaaaa;
  --accent: #ffd004; --accent-2: #fbbf24; --accent-text: #b38f00; --ok: #00a046; --ok-soft: #e6f9ec; --danger: #ff0000; --danger-soft: #fae6e6;
  --photo: #ffffff; --scrim: rgba(0, 0, 0, .5);
  --sh-card: 0 2px 2px rgba(0,0,0,.04), 0 4px 6px rgba(0,0,0,.04), 0 12px 24px rgba(0,0,0,.08);
  color-scheme: light;
}



*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14px/20px var(--f); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #000; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }

.chk { cursor: pointer; position: relative; }

/* ===== between the two mock-ups (laptops, tablets) ===== */
@media (max-width: 1500px) {
  .ftr .list { gap: 48px; }

}

  .nov-rows .row { grid-auto-columns: calc((100% - 3 * 24px) / 4); }

  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.st { background: var(--surface); border-radius: var(--r-card); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.st h2 { display: flex; align-items: center; gap: 12px; font: 600 20px/28px var(--f); }
.st h2 i { width: 32px; height: 32px; border-radius: 50%; background: #000; color: #ffd004; display: grid; place-items: center; font: 700 14px/1 var(--f); font-style: normal; flex: none; }
.st h2 small { color: var(--muted); font: 400 14px/20px var(--f); }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.st .fld label, #dvf .fld label { font: 500 13px/18px var(--f); color: var(--muted); }
.st .fld input, .st .fld textarea { height: 52px; border-radius: 12px; border: 1px solid var(--line); padding: 0 16px; font: 500 16px/24px var(--f); background: var(--surface); width: 100%; }
.st .fld textarea { height: auto; min-height: 96px; padding: 14px 16px; resize: vertical; }
.st .fld input:focus, .st .fld textarea:focus { outline: none; border-color: #ffd004; box-shadow: 0 0 0 3px rgba(255, 208, 4, .3); }
.st .fld.bad input { border-color: #e30613; background: #fff7f7; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.opt { position: relative; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; min-height: 72px; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:hover { box-shadow: inset 0 0 0 1px #ffd004; }
.opt:has(input:checked) { box-shadow: inset 0 0 0 2px #ffd004; background: #fffbea; }
.opt:has(input:focus-visible) { outline: 2px solid #000; outline-offset: 2px; }
.opt .oi { width: 40px; height: 40px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; flex: none; color: var(--ink); }
.opt .oi.lg b { font: 800 12px/1 var(--f); color: #fff; }
.opt .oi.np { background: #e30613; } .opt .oi.del { background: #1a73e8; } .opt .oi.sat { background: #0b5fa5; }
.opt .ot { display: flex; flex-direction: column; min-width: 0; }
.opt .ot b { font: 500 15px/20px var(--f); }
.opt .ot small { color: var(--muted); font: 400 12px/16px var(--f); }
.opt::after { content: ""; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); margin-left: auto; flex: none; }
.opt:has(input:checked)::after { box-shadow: inset 0 0 0 6px #ffd004; background: #000; }
.tplsel { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: var(--bg); font: 500 14px/20px var(--f); }
.tplsel select { margin-left: auto; border: 0; background: none; font: 600 14px/20px var(--f); }
#dvf:empty { display: none; }
.pick { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 12px; background: var(--bg); }
.pick .ico { color: #b38f00; }
.pick b { display: block; font: 500 15px/22px var(--f); }
.pick small { color: var(--muted); font: 400 13px/18px var(--f); }

/* ---------- listing: what's filtered ---------- */
.achips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 24px; }
.achips .found { color: var(--muted); font: 400 14px/20px var(--f); margin-right: 8px; }
.achips .found b { color: var(--ink); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 14px; border-radius: 100px; background: #000; color: #fff; font: 500 13px/18px var(--f); }
.chip .ico { color: #ffd004; }
.chip:hover { background: #262626; }

/* ---------- toast ---------- */
#toast .ta { margin-left: 16px; font: 600 14px/20px var(--f); color: #b38f00; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- mobile: bottom navigation + sticky action bars ---------- */
.tabbar, .mbar { display: none; }
@media (max-width: 1100px) {
  .cart2, .co2 { grid-template-columns: minmax(0, 1fr); }
  .sum2 { position: static; }
  .cln { grid-template-columns: 96px minmax(0, 1fr) auto; grid-template-areas: "ph info act" "ph q p"; gap: 12px 16px; }
  .lph { grid-area: ph; width: 96px; height: 96px; align-self: start; } .li { grid-area: info; } .la { grid-area: act; flex-direction: row; align-self: start; }
  .lq { grid-area: q; flex-direction: row; justify-self: start; } .lp { grid-area: p; }
}
@media (max-width: 767px) {
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: rgba(255,255,255,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 -1px 0 var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 60px; color: var(--muted); font: 500 11px/14px var(--f); }
  .tabbar a .ico { width: 24px; height: 24px; }
  .tabbar a.on { color: #000; }
  .tabbar a.on .ico { color: #000; }
  .tabbar a.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: #ffd004; }
  .tabbar .badge { position: absolute; top: 6px; left: calc(50% + 4px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ffd004; color: #000; font: 700 11px/18px var(--f); text-align: center; }
  .tabbar .badge:empty { display: none; }
  .totop { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .mbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 54; padding: 10px 16px; background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.06); }
  .mbar small { display: block; color: var(--muted); font: 400 12px/16px var(--f); }
  .mbar b { font: 700 20px/26px var(--f); white-space: nowrap; }
  .mbar .btn { min-height: 48px; padding: 0 22px; border-radius: 100px; display: inline-flex; align-items: center; gap: 8px; font: 600 15px/20px var(--f); }
  body[data-page="cart"], body[data-page="checkout"], body[data-page="p"] { padding-bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
  body[data-page="cart"] .totop, body[data-page="checkout"] .totop, body[data-page="p"] .totop { display: none; }
  .sbox .btn.big { display: none; }
  .cln { padding: 12px; } .lph { width: 80px; height: 80px; } .cln { grid-template-columns: 80px minmax(0, 1fr) auto; }
  .lnm { font-size: 14px; line-height: 20px; } .lp b { font-size: 17px; }
  .g2 { grid-template-columns: minmax(0, 1fr); }
  .st { padding: 20px 16px; } .st h2 { font-size: 18px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .sbox { padding: 20px 16px; }
  .achips .found { flex-basis: 100%; }
}

/* gutters between the 1920 and 390 mock-ups */
.wrap { max-width: 1664px; padding-inline: max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-left, 0px)) max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-right, 0px)); }
@media (max-width: 767px) {
  .nav .cartb, .nav .cartb + .sep { display: none !important; }
  .subcats { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
  .subcats::-webkit-scrollbar { display: none; }
  .subcats a { flex: none; }
  .cln { position: relative; grid-template-columns: 80px minmax(0, 1fr); grid-template-areas: "ph info" "q p"; gap: 12px; }
  .li { padding-right: 40px; }
  .la { position: absolute; top: 8px; right: 8px; flex-direction: column; gap: 4px; }
  .lq { flex-direction: row; gap: 8px; justify-self: start; align-self: center; }
  .lq small { display: none; }
  .lp { align-self: center; }
  .lctl { gap: 6px; }
  .sb { padding: 3px 8px; }
}

/* auth: form + wholesale benefits */
.authw { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 460px); justify-content: center; gap: 32px; align-items: start; margin: 16px auto 56px; }

@media (max-width: 1023px) { .authw { grid-template-columns: minmax(0, 1fr); max-width: 560px; } .b2bp { position: static; } }
@media (max-width: 767px) {

  .pc.f .heart { top: 8px; right: 8px; }
  .pc.f .tag { left: 8px; top: 8px; }
  .pc.f .lb-opt, .pc.f .lb-rrc { font-size: 10px; padding: 2px 6px; }
}
.authw .auth .fld { min-width: 0; }
.authw .auth .fld input, .authw .auth .fld select, .authw .auth .fld textarea { width: 100%; max-width: 100%; box-sizing: border-box; }
.pc .nm { overflow-wrap: break-word; white-space: normal; text-overflow: clip; }
.authw .auth { grid-template-columns: minmax(0, 1fr); }
.pc .nm, .pc.f .nm { display: -webkit-box !important; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }

.hero::after { content: ""; position: absolute; inset: auto 0 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 208, 4, .35), transparent); }

/* three columns of the same height */
.hero-row { height: 528px; gap: 24px; }
.hero .catside { width: 300px; flex: none; height: 528px; padding: 12px 8px; gap: 0; justify-content: flex-start; align-items: stretch;
  background: rgba(20, 20, 22, .72); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); border-radius: 24px;
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
.hero .catside .ci, .mega .catside .ci { flex: 1 1 auto; min-height: 30px; max-height: 48px; padding: 4px 10px; border-radius: 12px; align-items: center; cursor: pointer; text-align: left; }
.catside .ci .hl { gap: 10px; align-items: center; }
.catside .ci .hl span { font: 500 14px/18px var(--f); }
.catside .ci .hl .ico { width: 20px; height: 20px; }
.catside .ci:hover, .catside .ci.on { background: rgba(255, 255, 255, .08); }
.catside .ci.on { color: #ffd004; }
.catside .ci .chev { opacity: .5; }

/* subcategory panel: covers banner and promo, same height */
.hero-panel { left: 324px; right: 0; top: 0; bottom: 0; z-index: 6; padding: 20px 24px 24px; border-radius: 24px; background: #fff; color: #000;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45); overflow-y: auto; overscroll-behavior: contain; animation: panelIn .18s var(--ease, ease) both; }
.hero-row:has(.hero-panel:not([hidden])) .catside { border-radius: 24px; }
@keyframes panelIn { from { opacity: 0; transform: translateX(-8px); } }
.ph-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 4px 4px 16px; margin-bottom: 8px; border-bottom: 1px solid #e5e5e5; }
.ph-h b { font: 600 22px/28px var(--f); }
.ph-h a { display: inline-flex; align-items: center; gap: 6px; font: 600 14px/20px var(--f); color: #000; padding: 8px 14px; border-radius: 100px; background: #ffd004; white-space: nowrap; }
.ph-h a span { font-weight: 500; opacity: .6; }
.ph-h a:hover { background: #ffdc3d; }
.hero-panel .tiles, .mega .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px 16px; }
.tile { padding: 12px 8px; }
.tile .hd { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tile .tph { width: 104px; height: 104px; border-radius: 12px; }
.tile b { font: 500 14px/18px var(--f); }

.mega .panel { padding: 20px 24px 24px; }
.mega-in { height: 528px; max-height: calc(100vh - 180px); }

.mega .catside .ci { color: #fff; }
.mega-scrim { background: rgba(0, 0, 0, .45); }

/* banners: one design system, fits the 936 x 528 slot */
.slider { border-radius: 24px; background: #121214; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); touch-action: pan-y; user-select: none; cursor: grab; }
.slider.dragging { cursor: grabbing; }
.slider .track { display: flex; height: 100%; transition: transform .55s cubic-bezier(.22, .7, .2, 1); will-change: transform; }
.slider .slide { position: relative; inset: auto; flex: 0 0 100%; height: 100%; opacity: 1; visibility: visible; transition: none; }
.slide .bn { border-radius: 0; }
.sl-dots { left: 40px; bottom: 28px; z-index: 3; }
.sl-dots button { width: 8px; height: 8px; transition: width .25s, background .25s; border-radius: 4px; }
.sl-dots button.on { width: 28px; box-shadow: none; }

.bn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .92fr); align-items: center; gap: 24px; height: 100%; padding: 48px 40px 64px; color: #fff; overflow: hidden; position: relative;
  background: radial-gradient(80% 110% at 100% 0%, var(--glow, rgba(255, 208, 4, .22)), transparent 60%), linear-gradient(135deg, #1a1a1c 0%, #0f0f10 100%); }
.bn.r { --glow: rgba(227, 6, 19, .32); } .bn.b { --glow: rgba(26, 115, 232, .32); } .bn.y { --glow: rgba(255, 208, 4, .26); } .bn.g { --glow: rgba(0, 160, 120, .26); } .bn.v { --glow: rgba(255, 140, 0, .26); }
.bn .bt { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; }
.bn .eb { font: 700 13px/16px var(--f); letter-spacing: .14em; text-transform: uppercase; color: #ffd004; margin-bottom: 16px; }
.bn h2 { font: 800 clamp(30px, 2.6vw, 44px)/1.04 var(--f); letter-spacing: -.02em; text-transform: uppercase; text-wrap: balance; }
.bn h2 em { font-style: italic; color: #ffd004; }
.bn p { margin-top: 16px; color: rgba(255, 255, 255, .72); font: 400 16px/24px var(--f); max-width: 40ch; }
.bn .btn.w { margin-top: 28px; display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 22px 0 28px; border-radius: 100px; background: #fff; color: #000; font: 600 16px/20px var(--f); }
.bn .btn.w .ico { margin: 0; }
.bn .btn.w:hover { background: #ffd004; }
.bn .pics { position: relative; height: 100%; min-height: 0; }
.bn .pics span { position: absolute; display: grid; place-items: center; background: #fff; border-radius: 20px; box-shadow: 0 24px 48px rgba(0, 0, 0, .5); overflow: hidden; }
.bn .pics span img { width: 86%; height: 86%; object-fit: contain; pointer-events: none; }
.bn .pics span:nth-child(1) { width: 62%; aspect-ratio: 1; right: 4%; top: 2%; transform: rotate(3deg); }
.bn .pics span:nth-child(2) { width: 44%; aspect-ratio: 1; left: 0; bottom: 6%; transform: rotate(-5deg); }
.bn .pics span:nth-child(3) { width: 33%; aspect-ratio: 1; right: 0; bottom: 0; transform: rotate(6deg); }

p>б) він дає дозвіл на збір, обробку та передачу персональних даних на умовах, визначених нижче в Застереженні щодо збору, обробки та передачі персональних даних дозвіл на обробку персональних даних діє протягом усього терміну дії Договору, а також протягом необмеженого строку після закінчення його дії. Крім цього, укладенням Договору Замовник підтверджує, що він повідомлень (без додаткового повідомлення) про права, встановлені Законом України \"Про захист персональних даних\", про цілі збору даних, а також про те, що його персональні дані передаються Продавцю з метою можливості виконання умов цього Договору, можливості проведення взаєморозрахунків, а також для отримання рахунків, актів та інших документів. Замовник також погоджується з тим, що Продавець має право надавати доступ та передавати його персональні дані третім особам без будь-яких додаткових повідомлень Замовника, не змінюючи при цьому мету обробки персональних даних. Обсяг прав Замовника як суб’єкта персональних даних відповідно до Закону України \"Про захист персональних даних\" йому відомий і зрозумілий.</p>\n<h3>3. ЦІНА ТОВАРУ</h3>\n<p>3.1. Ціна Товару вказана на сайті Інтернет-магазину.</p>\n<p>3.2. Продавець має право в односторонньому порядку змінити ціну на будь-яку позицію товару.</p>\n<p>3.3. У разі зміни ціни на замовлений Товар, Продавець зобов’язується обов’язково інформувати Покупця про таку зміну ціни Товару.</p>\n<p>3.4. Покупець має право підтвердити або анулювати своє Замовлення на придбання Товару, якщо ціна змінена Продавцем після оформлення Замовлення.</p>\n<p>3.5. Зміна Продавцем ціни на вже оплачений Покупцем Товар не допускається.</p>\n<p>3.6. Продавець вказує вартість тарифів з доставки Товару на сайті Інтернет-магазину або повідомляє Покупцеві про додаткові тарифи з доставки під час оформлення Замовлення Покупцем.</p>\n<p>3.7. Зобов’язання Покупця по оплаті Товару вважаються виконаними з моменту надходження Продавцю коштів, що дорівнюють сумі Замовлення.</p>\n<p>3.8. Розрахунки між Продавцем та Покупцем за Товар здійснюються способами, зазначеними на сайті Інтернет-магазину у розділі \"Оплата і Доставка\".</p>\n<h3>4. ОФОРМЛЕННЯ ЗАМОВЛЕННЯ</h3>\n<p>4.1. Замовлення Товару здійснюється Покупцем через Оператора за телефоном: 050 305 58 83 або через сервіс сайту Інтернет-магазин сайт https://platanik.com</p>\n<p>4.2. При реєстрації на сайті Інтернет-магазину Покупець зобов’язується надати наступну реєстраційну інформацію:</p>\n<p>4.2.1. прізвище, ім’я, по батькові Покупця або вказаної ним особини (одержувача);</p>\n<p>4.2.2. адреси, за якими слід доставити Товар (якщо доставка до адреси Покупця);</p>\n<p>4.2.3. Адреси електронної пошти;</p>\n<p>4.2.4. контактний телефон.</p>\n<p>4.3. Найменування, кількість, артикул, ціна обраного Покупцем Товару вказуються в кошику Покупця на сайті Інтернет-магазину.</p>\n<p>4.4. Якщо Продавцю потрібна додаткова інформація, він має право запросити її у Покупця. У разі ненадання необхідної інформації Покупцем, Продавець не несе відповідальності за надання якісної послуги Покупцю при покупці товарів інтернет-маркеті.</p>\n<p>4.5. При оформленні Замовлення через Оператора (п. 4.1. Цієї Оферти) Покупець зобов’язується надати інформацію, зазначену у п. 4.2. та у п. 4.5 цієї Оферти, оскільки замовлення здійснюється в усній формі.</p>\n<p>4.6. Ухвалення Покупцем умов цієї Оферти здійснюється за допомогою внесення Покупцем відповідних даних до реєстраційної форми на сайті Інтернет-магазину або при оформленні Замовлення через Оператора. Після оформлення Замовлення через Оператора дані про Покупця реєструються у базі даних Продавця.</p>\n<p>4.7. Покупець несе відповідальність за достовірність наданої інформації при оформленні Замовлення.</p>\n<p>4.8. Договір купівлі-продажу дистанційним способом між Продавцем та Покупцем вважається укладеним з моменту електронного оформлення замовлення на сервісі сайту інтернет-магазину або видачі певного документа, що підтверджує оплату Товару.</p>\n<h3>5. ДОСТАВКА І ПЕРЕДАЧА ТОВАРУ ПОКУПЦЮ</h3>\n<p>5.1. Способи, порядок та термін доставки товарів вказані на сайті в розділі \"Оплата і Доставка\". Порядок та умови доставки замовленого товару Покупець погоджує з оператором інтернет-маркету в момент оформлення покупки.</p>\n<p>5.2. Доставка товару здійснюється власними силами співробітниками інтернет-маркету згідно з умовами доставки, або із залученням третіх осіб (перевізника).</p>\n<p>5.3. При отриманні товару Замовник повинен у присутності представника працівника поштового відділення або кур’єра перевірити відповідність Товару якісним і кількісним характеристикам, (найменування товару, кількість, комплектність, термін придатності).</p>\n<p>5.4. Замовник або Представник Замовника під час приймання товару підтверджує своїм підписом у товарному чеку та/або замовлення на доставку товарів, що не має претензій до кількості товару, зовнішнім виглядом та комплектності товару.</p>\n<h3>6. ПОВЕРНЕННЯ ТОВАРУ</h3>\n<p>6.1. Замовник має право відмовитися від непідакцизного товару будь-якої години до його передачі, а після передачі непідакцизного товару - у порядку та на умовах, визначених Законом України \"Про захист прав споживачів\".</p>\n<p>6.2. Повернення непідакцизного товару належної якості можливе у разі, якщо збережено його товарний вигляд, споживчі властивості, а також документ, що підтверджує факт купівлі та умови замовлення зазначеного товару.</p>\n<p>6.3. Замовник не має права відмовитися від товару належної якості, що має індивідуально-визначені властивості, якщо зазначений товар може бути використаний виключно Споживачем, який його придбав, (в т.ч. не стандартні, за бажанням Замовника, розміри та інше). Підтвердженням того, що товар має індивідуально-визначені властивості, є відмінність розмірів товару та інших характеристик, що вказані в інтернет-магазині.</p>\n<p>6.4. Повернення товару, у випадках, передбачених законом та цим Договором, здійснюється за адресою, вказаною на сайті у розділі \" Контактна інформація\".</p>\n<p>6.5. При відмові Покупця від непідакцизного товару належної якості Продавець повертає кошти у розмірі вартості такого Товару, за винятком витрат продавця на доставку товару, який повертається.</p>\n<p>6.6. Повернення суми, зазначеної у п.6.5. здійснюється одночасно з поверненням товару.</p>\n<h3>7. ВІДПОВІДАЛЬНІСТЬ СТОРІН</h3>\n<p>7.1. Продавець не несе відповідальності за шкоду, заподіяну Покупцеві внаслідок помилково зазначених Покупцем платіжних реквізитів Продавця.</p>\n<p>7.2. Продавець не несе відповідальності за неналежне, несвоєчасне виконання Замовлень і своїх зобов’язань у разі надання Покупцем недостовірної або помилкової інформації.</p>\n<p>7.3. Продавець і Покупець несуть відповідальність за виконання своїх зобов’язань відповідно до чинного законодавства України та положень цього Договору.</p>\n<p>7.4. Продавець і Покупець звільняються від відповідальності за повне або часткове невиконання своїх зобов’язань, якщо невиконання є наслідком форс-мажорних обставин як: війна або військові дії, землетрус, повінь, пожежа та інші стихійні лиха, що виникли незалежно від волі Продавця і / або Покупця після укладання цього договору. Сторона, яка не може виконати своїх зобов’язань, негайно повідомляє про це іншу Сторону.</p>\n<h3>АДРЕСИ ТА РЕКВІЗИТИ ПРОДАВЦЯ</h3>\n<p><b>ЄДРПОУ:</b> 35247533 <br><b>Юридична адреса:</b> 62302, Харківська область, м. Дергачі, вул. Сумський шлях, буд.163-Г<br>Пот./рах.: UA103515330000026006052195533</p>\n<p>в ПАТ КБ \"Приватбанк\", МФО 351533</p>\n<p>Свідоцтво про реєстрацію платника ПДВ № 200154799 від 17.12.2013р.</p>\n<p>ІПН: 352475320389</p>";

/* ===== catalogue: list of main categories + panel of subcategories =====
   hover (desktop) previews a category, click pins it; a click on an already open category does nothing;
   the page of a category opens only from the panel ("All products of the section"); a click anywhere else closes. */
const hasKids = c => (c.ch || []).some(id => { const k = S.catById.get(id); return k && catItems(k).length; });
function catLinkList(active) {
  return topCats().map(c => `<a class="ci${active === c.id ? ' on' : ''}" href="#c${c.id}" data-mc="${c.id}" role="button" aria-expanded="${active === c.id}"><span class="hl">${ic(CAT_ICON[c.k] || 'cParts')}<span>${esc(cn(c))}</span></span>${ic('chr', 'chev')}</a>`).join('');
}
function catPanel(c) {
  const kids = (c.ch || []).map(id => S.catById.get(id)).filter(k => k && catItems(k).length);
  const tile = (href, img, name, subs) => `<div class="tile"><a class="hd" href="${href}"><span class="tph">${img}</span><b>${esc(name)}</b></a>${subs && subs.length ? `<div class="subs">${subs.map(s => `<a href="#c${s.id}">${esc(cn(s))}</a>`).join('')}</div>` : ''}</div>`;
  const head = `<div class="ph-h"><b>${esc(cn(c))}</b><a href="#c${c.id}" data-close-cat>${R('Усі товари розділу', 'Все товары раздела')} <span>${fmtN(catItems(c).length)}</span>${ic('chr', 's16')}</a></div>`;
  if (kids.length) return head + `<div class="tiles">${kids.map(k => tile('#c' + k.id, catImg(k), cn(k), (k.ch || []).map(id => S.catById.get(id)).filter(x => x && catItems(x).length).slice(0, 10))).join('')}</div>`;
  return head + `<div class="tiles">${catItems(c).map(id => S.byId.get(id)).filter(x => x && x.i != null).slice(0, 10).map(it => tile('#p' + it.id, pimg(it), nm(it))).join('')}</div>`;
}
/* one controller for both places: the hero list on the home page and the dropdown under "Каталог товарів" */
function catController(side, panel, show, hide) {
  let tm, pinned = false, cur = null;
  const open = id => {
    if (cur === id) { show(); return; }
    cur = id; const c = S.catById.get(id); if (!c) return;
    $$('[data-mc]', side).forEach(x => { const on = +x.dataset.mc === id; x.classList.toggle('on', on); x.setAttribute('aria-expanded', on); });
    panel.innerHTML = catPanel(c); panel.scrollTop = 0; show();
  };
  const reset = () => { pinned = false; cur = null; $$('[data-mc]', side).forEach(x => { x.classList.remove('on'); x.setAttribute('aria-expanded', 'false'); }); hide(); };
  side.addEventListener('click', e => { const a = e.target.closest('[data-mc]'); if (!a) return; e.preventDefault(); clearTimeout(tm);
    const c = S.catById.get(+a.dataset.mc); if (c && !hasKids(c)) { reset(); closeCatalog(); location.hash = 'c' + c.id; return; }   // no subcategories: straight to the products
    pinned = true; open(+a.dataset.mc); });
  if (matchMedia('(hover: hover)').matches) {

/* drag-to-scroll with the mouse for horizontal strips (brands, product rows); touch keeps native scrolling */
function dragScroll(el) {
  if (!el || el._drag) return; el._drag = 1;
  let x0 = 0, s0 = 0, down = false, moved = false;
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button !== 0) return; down = true; moved = false; x0 = e.clientX; s0 = el.scrollLeft; });
  window.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - x0; if (!moved && Math.abs(dx) > 5) { moved = true; el.classList.add('dragging'); } if (moved) { el.scrollLeft = s0 - dx; e.preventDefault(); } });
  window.addEventListener('pointerup', () => { if (!down) return; down = false; el.classList.remove('dragging'); });
  el.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  el.addEventListener('dragstart', e => e.preventDefault());
}

/* ===== Nova Poshta directory in checkout: settlements → branches / parcel lockers (поштомати) =====
   On own hosting the calls go through api.php (key in api/config.php → np_key, never in this public code).
   Without the backend (GitHub Pages) the public API is called directly without a key; NP may refuse that.
   If the API is unreachable the fields simply stay free-text inputs, so checkout never breaks. */
const NP = {
  url: 'https://api.novaposhta.ua/v2.0/json/', down: false, cache: new Map(),
  async call(modelName, calledMethod, methodProperties) {
    if (this.down) throw new Error('down');
    if (API.on) {   // own hosting: the request goes through api.php, where the company key is kept (config.php → np_key)
      const key = 'p' + JSON.stringify([calledMethod, methodProperties]); if (this.cache.has(key)) return this.cache.get(key);
      const body = calledMethod === 'searchSettlements' ? { m: 'cities', q: methodProperties.CityName } : { m: 'whs', city: methodProperties.CityRef, q: methodProperties.FindByString };
      const j = await API.req('np', body); this.cache.set(key, j.data); return j.data;
    }
    const key = JSON.stringify([calledMethod, methodProperties]); if (this.cache.has(key)) return this.cache.get(key);
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 6000);
    try {
      const r = await fetch(this.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ apiKey: '', modelName, calledMethod, methodProperties }), signal: ctl.signal });
      const j = await r.json(); if (!j.success) throw new Error((j.errors || []).join(', ') || 'np');
      this.cache.set(key, j.data); return j.data;
    } catch (e) { if (e.name === 'AbortError' || e instanceof TypeError) this.down = true; throw e; } finally { clearTimeout(tm); }
  },
  cities(q) { return this.call('Address', 'searchSettlements', { CityName: q, Limit: '20', Page: '1' }).then(d => ((d[0] || {}).Addresses || []).filter(a => a.DeliveryCity).map(a => ({ label: a.Present, value: a.MainDescription, ref: a.DeliveryCity }))); },
  whs(cityRef, q, lockers) { return this.call('Address', 'getWarehouses', { CityRef: cityRef, FindByString: q || '', Limit: '60', Page: '1' }).then(d => d.filter(w => lockers ? w.CategoryOfWarehouse === 'Postomat' : w.CategoryOfWarehouse !== 'Postomat').map(w => ({ label: (S.lang === 'ru' && w.DescriptionRu) || w.Description, value: (S.lang === 'ru' && w.DescriptionRu) || w.Description, ref: w.Ref }))); },
};
/* generic autocomplete under an input: src(q) → Promise<[{label,value,ref}]> */
function autoList(inp, src, onPick, opt = {}) {
  if (!inp || inp._ac) return; inp._ac = 1; inp.setAttribute('autocomplete', 'off');
  const box = document.createElement('div'); box.className = 'acl'; box.hidden = true; box.setAttribute('role', 'listbox');
  inp.parentElement.style.position = 'relative'; inp.insertAdjacentElement('afterend', box);
  let tm, items = [], idx = -1, seq = 0;
  const close = () => { box.hidden = true; idx = -1; };
  const show = list => { items = list; idx = -1; box.innerHTML = list.length ? list.slice(0, 40).map((x, i) => `<button type="button" role="option" data-i="${i}">${esc(x.label)}</button>`).join('') : `<div class="acn">${opt.empty || R('Нічого не знайдено', 'Ничего не найдено')}</div>`; box.hidden = false; };
  const run = () => { const q = inp.value.trim(); if (q.length < (opt.min ?? 2)) { close(); return; } const my = ++seq; box.innerHTML = `<div class="acn">${R('Шукаємо…', 'Ищем…')}</div>`; box.hidden = false; src(q).then(l => { if (my === seq) show(l); }).catch(() => { if (my === seq) close(); }); };
  inp.addEventListener('input', () => { inp.dataset.ref = ''; clearTimeout(tm); tm = setTimeout(run, 250); });
  inp.addEventListener('focus', () => { if (opt.min === 0) run(); });
  inp.addEventListener('keydown', e => { if (box.hidden) return; const bs = $$('button', box); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.classList.toggle('on', i === idx)); bs[idx]?.scrollIntoView({ block: 'nearest' }); } else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); bs[idx].click(); } else if (e.key === 'Escape') close(); });
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const x = items[+b.dataset.i]; inp.value = x.value; inp.dataset.ref = x.ref; close(); inp.dispatchEvent(new Event('change', { bubbles: true })); onPick && onPick(x); });
  inp.addEventListener('blur', () => setTimeout(close, 120));
}
/* wires city + branch inputs inside a checkout block; kind: 'np' | 'npp' (lockers) | 'npc' (courier) */
function npBind(root, kind, pre = 'o') {

  if (br && kind !== 'npc') autoList(br, q => city.dataset.ref ? NP.whs(city.dataset.ref, q, kind === 'npp') : Promise.reject(0), null, { min: 0, empty: kind === 'npp' ? R('У цьому місті поштоматів не знайдено', 'В этом городе почтоматы не найдены') : R('Відділень не знайдено', 'Отделений не найдено') });
}

function demoData() {

  const orders = stOf.map((st, i) => {
    const date = addDays(today, -(i * 5 + Math.floor(rnd() * 3) + (i ? 1 : 0)));
    const lines = Array.from({ length: 2 + Math.floor(rnd() * 5) }, () => { const it = pick(); return { id: it.id, n: nm(it), cc: it.cc, q: [1, 2, 2, 4, 5, 10][Math.floor(rnd() * 6)], p: Math.round(+it.p * (1 - disc) * 100) / 100, wh: 0 }; });
    const sum = Math.round(lines.reduce((a, l) => a + l.p * l.q, 0) * 100) / 100;
    return { no: String(24318 - i * 7), date: isoD(date), st, n: lines.reduce((a, l) => a + l.q, 0), sum, items: lines, lines: lines.map(l => ({ id: l.id, q: l.q, wh: l.wh })), demo: 1,
      ttn: ['sent', 'done'].includes(st) ? '2045' + String(1e9 + Math.floor(rnd() * 9e9)).slice(0, 10) : '',

  });
  const DEF = 14;
  const invoices = orders.filter(o => o.st !== 'new' && o.st !== 'canc' && o.st !== 'conf').map((o, i) => {
    const date = addDays(o.date, 1), due = addDays(date, DEF);

  // payments: one per fully paid invoice (a few days before due), plus the partial one

  const returns = [[0, 1, 'defect', 'done'], [2, 0, 'fit', 'ok'], [3, 1, 'damage', 'wait'], [5, 0, 'fit', 'no']].map(([oi, li, why, st], i) => {

  const tpls = [{ name: R('Склад у Києві', 'Склад в Киеве'), dv: 'np', city: R('Київ', 'Киев'), branch: R('Відділення №25', 'Отделение №25'), rname: R('Коваленко Андрій Петрович', 'Коваленко Андрей Петрович'), rphone: '+380 67 000 00 00', pay: 'inv', demo: 1 },
    { kind: 'drop', name: '', dv: 'np', city: R('Львів', 'Львов'), branch: R('Відділення №12', 'Отделение №12'), rtype: 'fiz', rname: R('Бондар Ірина Олегівна', 'Бондарь Ирина Олеговна'), rphone: '+380 63 000 00 00', pay: 'inv', demo: 1 },
    { name: R('СТО Житомир', 'СТО Житомир'), rtype: 'ur', company: R('ТОВ «Автотрак-Сервіс»', 'ООО «Автотрак-Сервис»'), edrpou: '00000000', dv: 'npc', city: R('Житомир', 'Житомир'), branch: R('вул. Київська, 77', 'ул. Киевская, 77'), rname: R('Мельник Олег', 'Мельник Олег'), rphone: '+380 50 000 00 00', pay: 'cod', demo: 1 }];

    ${cur.rows.length ? `<div class="th f5"><span>${R('Дата', 'Дата')}</span><span>${R('Документ', 'Документ')}</span><span class="r">${R('Дебет', 'Дебет')}</span><span class="r">${R('Кредит', 'Кредит')}</span><span class="r">${R('Сальдо', 'Сальдо')}</span></div>

/* ===== phone inputs: "+38 (0" is typed for the customer, they enter only the digits ===== */
function fmtPhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('380')) d = d.slice(2); else if (d.startsWith('38')) d = d.slice(2); else if (d.startsWith('80')) d = d.slice(1);
  if (d && d[0] !== '0') d = '0' + d;
  d = d.slice(0, 10);
  const p = [d.slice(0, 3), d.slice(3, 6), d.slice(6, 8), d.slice(8, 10)];
  let s = '+38 (' + p[0]; if (d.length > 3) s += ') ' + p[1]; if (d.length > 6) s += '-' + p[2]; if (d.length > 8) s += '-' + p[3];
  return s;
}
function phoneMask(el) {
  if (!el || el._pm) return; el._pm = 1;
  if (el.value) el.value = fmtPhone(el.value);
  el.setAttribute('placeholder', '+38 (0__) ___-__-__'); el.setAttribute('inputmode', 'tel');
  el.addEventListener('focus', () => { if (!el.value) { el.value = '+38 (0'; setTimeout(() => el.setSelectionRange(el.value.length, el.value.length), 0); } });
  el.addEventListener('blur', () => { if (el.value.replace(/\D/g, '').length <= 3) el.value = ''; });
  el.addEventListener('input', e => { if (e.inputType && e.inputType.startsWith('delete') && el.value.replace(/\D/g, '').length <= 3) { el.value = '+38 (0'; return; } const v = fmtPhone(el.value); el.value = v; el.dispatchEvent(new Event('change', { bubbles: true })); });
}
/* every tel input on the site gets the mask as soon as it appears */
new MutationObserver(() => $$('input[type=tel]').forEach(phoneMask)).observe(document.documentElement, { childList: true, subtree: true });

/* ===== styled dropdown for toolbar selects (per page, sort): native <select> stays for state/keyboard fallback ===== */
function niceSelect(sel) {
  if (!sel || sel._ns) return; sel._ns = 1;
  const w = document.createElement('span'); w.className = 'nsel';
  const lab = () => (sel.options[sel.selectedIndex] || {}).text || '';
  w.innerHTML = `<button type="button" class="nsb" aria-haspopup="listbox" aria-expanded="false"><span>${esc(lab())}</span><svg class="ico s16" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="nsl" role="listbox" hidden>${[...sel.options].map(o => `<button type="button" role="option" data-v="${esc(o.value)}" aria-selected="${o.selected}">${esc(o.text)}${ic('check', 's16')}</button>`).join('')}</div>`;
  sel.classList.add('nsel-n'); sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
  sel.insertAdjacentElement('afterend', w);
  const btn = $('.nsb', w), list = $('.nsl', w);
  const close = () => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); const op = list.hidden; $$('.nsl').forEach(x => { x.hidden = true; }); list.hidden = !op; btn.setAttribute('aria-expanded', op); });
  list.addEventListener('click', e => { const o = e.target.closest('[data-v]'); if (!o) return; e.preventDefault(); e.stopPropagation(); sel.value = o.dataset.v; $$('[data-v]', list).forEach(x => x.setAttribute('aria-selected', x === o)); $('span', btn).textContent = lab(); close(); sel.dispatchEvent(new Event('change', { bubbles: true })); });
  document.addEventListener('click', e => { if (!w.contains(e.target)) close(); });
  w.addEventListener('keydown', e => { if (e.key === 'Escape') { close(); btn.focus(); } });

/* ===== DEMO data for the prototype (Igor asked to see how these states look) =====
   - every ~10th product is shown as out of stock;
   - some in-stock products get an old price (discount badge);

   Remove applyDemo() from boot (views3.js) once real stock/prices come from 1C. */
const DEMO_ON = true;
function applyDemo(d) {
  if (!DEMO_ON) return;
  d.wh = [...d.wh, 'Одеса'];
  const h = id => ((+id * 2654435761) >>> 0) % 1000;
  d.items.forEach(it => {
    const k = h(it.id);
    if (it.cc === 'BAD4193') { it.s = [...(it.s || []), '>10']; it.op = Math.round(it.p * 1.2); return; }
    if (k % 10 === 3) { it.s = (it.s || []).map(() => '0'); return; }
    if (k % 12 === 5 && !it.ak) it.op = Math.round(it.p * (1.1 + (k % 4) * 0.05));
  });
}

function sanitize(html) {
  const d = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html');
  d.querySelectorAll('script,style,iframe,object,embed,form,input,button,select,textarea,img,svg,video,link,meta,noscript,.breadcrumb,h1').forEach(e => e.remove());
  d.querySelectorAll('*').forEach(e => { [...e.attributes].forEach(a => { if (!['href', 'colspan', 'rowspan'].includes(a.name)) e.removeAttribute(a.name); }); if (e.tagName === 'A') { const h = e.getAttribute('href') || ''; if (!/^https?:/.test(h)) e.removeAttribute('href'); else { e.setAttribute('target', '_blank'); e.setAttribute('rel', 'noopener'); } } });
  d.querySelectorAll('table').forEach(tb => { const w = d.createElement('div'); w.className = 'tw'; tb.replaceWith(w); w.appendChild(tb); });
  const root = d.body.firstChild;
  root.querySelectorAll('div, span').forEach(e => { if (!e.textContent.trim() && !e.querySelector('table')) e.remove(); });
  return root.innerHTML.replace(/(<br>\s*){3,}/g, '<br><br>');
}

/* ===== router ===== */
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  openMega(false); closeModal(); openFilters(false); closeSugg(); closeUserMenu();
  if (h !== 'order-done' && S.done && h !== 'cart') S.done = null;
  let m;
  if (h === 'home') viewHome();
  else if ((m = h.match(/^c(\d+)$/))) viewCategory(+m[1]);
  else if ((m = h.match(/^p(\d+)$/))) viewProduct(+m[1]);
  else if ((m = h.match(/^b-([a-z0-9-]+)$/))) viewBrand(m[1]);
  else if ((m = h.match(/^news-(\d+)$/))) viewNews(+m[1]);
  else if (h === 'catalog') viewCatalog();
  else if (h === 'search') viewSearch();
  else if (h === 'cart') viewCart();
  else if (h === 'checkout') viewCheckout();
  else if (h === 'order-done') viewDone();
  else if (h === 'favorites') viewFavorites();
  else if (h === 'brands') viewBrands();
  else if (h === 'new') viewNew();
  else if (h === 'news') viewNews();
  else if (h === 'login') viewAuth('login');
  else if (h === 'register') viewAuth('register');
  else if (h === 'account') viewAccount();
  else if (h === 'account-edit') viewAccount(true);
  else if (h === 'account-orders') viewOrders();
  else if ((m = h.match(/^account-order-(.+)$/))) viewOrder(m[1]);
  else if (h === 'account-invoices' || h === 'account-finance' || h === 'account-act') viewAccStub(h);
  else if (h === 'account-returns') viewReturns();
  else if (h === 'account-delivery') viewTpls();
  else if (h === 'account-delivery-new') viewTplNew();
  else if (INFO.some(r => r[0] === h)) viewInfo(h);
  else viewNotFound();
  if (S.routeKey !== h) window.scrollTo(0, 0);
  S.routeKey = h;
  const pg = h.split('-')[0].replace(/^[cpb]\d.*$|^b$/, x => x[0]);
  document.body.dataset.page = /^c\d+$/.test(h) ? 'c' : /^p\d+$/.test(h) ? 'p' : pg;
  $$('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === document.body.dataset.page || (a.dataset.tab === 'catalog' && document.body.dataset.page === 'c')));
  $('#view').focus({ preventScroll: true });
}

    const oc2 = tg.closest('[data-open-cart]'); if (oc2 && !matchMedia('(max-width: 860px)').matches && location.hash !== '#cart' && location.hash !== '#checkout') { e.preventDefault(); $('#toast').classList.remove('on'); cartModal(); return; }
    const cr = tg.closest('[data-car]'); if (cr) { const [mk, md] = cr.dataset.car.split('|'); setCar({ mk, md: md || '', y: 0 }); }
    const sr = tg.closest('[data-search]'); if (sr) { e.preventDefault(); goSearch(sr.dataset.search); return; }
    const lg = tg.closest('[data-lang]'); if (lg) { S.lang = lg.dataset.lang; document.documentElement.lang = S.lang === 'ru' ? 'ru' : 'uk'; saveAll(); renderChrome(); route(); return; }
    if (tg.closest('#catbtn')) { openMega(!S.megaOpen); return; }
    if (tg.closest('#burger')) { openMobileMenu(); return; }
    if (tg.closest('#userbtn')) { toggleUserMenu(); return; }
    if (!tg.closest('.catside, .hero-panel, .mega .panel, #catbtn')) closeCatalog();
    if (tg.closest('[data-close-cat]')) closeCatalog();
    if (!tg.closest('.search')) closeSugg();
    if (!tg.closest('.user-w')) closeUserMenu();
    if (tg.closest('#totop')) window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.addEventListener('submit', e => { if (e.target.id === 'sform') { e.preventDefault(); const links = $$('#sugg a'); if (sugIdx >= 0 && links[sugIdx] && !links[sugIdx].hasAttribute('data-sall')) { location.hash = links[sugIdx].getAttribute('href').slice(1); closeSugg(); } else goSearch($('#q').value); $('#q').blur(); } });
  document.addEventListener('input', e => { if (e.target.id === 'q') renderSugg(e.target.value); });
  document.addEventListener('focusin', e => { if (e.target.id === 'q' && e.target.value) renderSugg(e.target.value); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeCatalog(); closeSugg(); openFilters(false); closeUserMenu(); return; }
    if (e.target.id === 'q' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { const links = $$('#sugg a'); if ($('#sugg').hidden || !links.length) return; e.preventDefault(); sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length; links.forEach((a, i) => a.classList.toggle('on', i === sugIdx)); links[sugIdx].scrollIntoView({ block: 'nearest' }); }
  });
  document.addEventListener('click', e => { const a = e.target.closest('#sugg a'); if (a && a.hasAttribute('data-sall')) { e.preventDefault(); goSearch($('#q').value); } else if (a) closeSugg(); }, true);
  window.addEventListener('scroll', () => { $('#totop').classList.toggle('on', window.scrollY > 700); }, { passive: true });
  window.addEventListener('hashchange', () => { closeCatalog(); route(); });
}
function toggleUserMenu() {
  if ($('#umenu')) return closeUserMenu();
  const w = $('.user-w'); const p = document.createElement('div'); p.className = 'menu-pop'; p.id = 'umenu';
  p.innerHTML = S.user ? `<a href="#account">${t('profile')}</a><a href="#account-orders">${t('myOrders')}</a>${isWholesale() ? `<a href="#account-invoices">${t('invoices')}</a><a href="#account-finance">${R('Фінанси', 'Финансы')}</a>` : ''}<a href="#account-delivery">${t('delivTpl')}</a><a href="#favorites">${t('favorites')}</a><button type="button" id="ulogout">${t('logout')}</button>` : `<a href="#login">${t('login')}</a><a href="#register">${t('register')}</a>`;
  w.appendChild(p); $('#userbtn').setAttribute('aria-expanded', 'true');
  const lo = $('#ulogout'); if (lo) lo.addEventListener('click', () => { if (API.on) API.req('logout', {}).catch(() => {}); S.user = null; S.optPrices = null; if (API.on) S.orders = []; saveAll(); renderChrome(); location.hash = 'home'; });
}
function openMobileMenu() {
  const ru = S.lang === 'ru';
  const m = modal(`<div class="mh"><a class="logo" href="#home" data-close style="color:var(--accent)">${LOGO()}</a><button type="button" data-close aria-label="${t('close')}">${ic('x')}</button></div>
    <div class="mb mmenu"><div class="lang" style="gap:16px"><button type="button" data-lang="ua" aria-pressed="${S.lang === 'ua'}" style="color:var(--ink)">UA</button><button type="button" data-lang="ru" aria-pressed="${S.lang === 'ru'}" style="color:var(--ink)">RU</button></div>
      <nav class="mm-cats">${topCats().map(c => `<a href="#c${c.id}" data-close>${ic(CAT_ICON[c.k] || 'cParts', 's')} ${esc(cn(c))}</a>`).join('')}</nav>
      <nav class="mm-links"><a href="${S.user ? '#account' : '#login'}" data-close>${ic('user', 's')} ${S.user ? t('cabinet') : t('login')}</a><a href="#favorites" data-close>${ic('heart', 's')} ${t('favorites')}</a><a href="#brands" data-close>${t('brandsT')}</a><a href="#delivery" data-close>${t('payDelivery')}</a><a href="#warranty" data-close>${t('warranty')}</a><a href="#returns" data-close>${t('returns')}</a><a href="#dropshipping" data-close>${t('dropshipping')}</a><a href="#about" data-close>${t('about')}</a><a href="#contacts" data-close>${t('fContacts')}</a><button type="button" data-feedback data-close class="mm-fb">${ic('chat', 's')} ${R('Зворотний зв’язок', 'Обратная связь')}</button></nav>
      <div class="mm-contact"><a href="tel:${CONFIG.phoneTel}"><b class="num">${esc(CONFIG.phone)}</b></a><span class="muted">${esc(loc(CONFIG.hoursShort))}</span><div style="display:flex;gap:10px"><a class="btn sm" href="https://t.me/${CONFIG.telegram}" target="_blank" rel="noopener">${ic('telegram', 's')} Telegram</a><a class="btn line sm" href="viber://chat?number=%2B${CONFIG.viber.replace(/\D/g, '')}">${ic('viber', 's')} Viber</a></div></div></div>`, 'msheet');
  m.classList.add('side');
}

/* ===== boot ===== */
(async function boot() {
  loadAll(); document.documentElement.lang = S.lang === 'ru' ? 'ru' : 'uk';
  renderChrome(); bindGlobal();
  document.body.insertAdjacentHTML('beforeend', `<button class="fbb" type="button" data-feedback aria-label="${R('Зворотний зв’язок', 'Обратная связь')}">${ic('chat')}<span>${R('Зворотний зв’язок', 'Обратная связь')}</span></button>`);
  $('#view').innerHTML = `<div class="wrap" style="padding-block:24px"><div class="grid">${'<div class="sk"></div>'.repeat(10)}</div></div>`;
  try {
    const cP = fetch('data/codes.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));   // demo OEM / cross numbers, box qty
    const r = await fetch('data/catalog.json'); if (!r.ok) throw new Error(r.status);
    const d = await r.json(); const codes = await cP;
    d.items.forEach(it => { const k = codes[it.id]; if (k) { it.oem = k.o; it.xc = k.x; it.bx = k.bx; } }); applyDemo(d);
    S.wh = d.wh; S.cats = d.cats; S.items = d.items; S.brands = d.brands; S.fit = d.fit || {}; S.fitfam = d.fitfam || {}; S.car = store.get('car', { mk: '', md: '', y: 0 }); if (!S.fit[S.car.mk]) S.car = { mk: '', md: '', y: 0 };
    S.cats.forEach(c => { S.catById.set(c.id, c); S.catByKey.set(c.k, c); c._own = []; });
    S.items.forEach(it => { S.byId.set(it.id, it); (it.c || []).forEach(cid => { const c = S.catById.get(cid); if (c) c._own.push(it.id); }); });
    S.items.forEach(indexItem);
    const maxId = Math.max(...S.items.map(i => i.id)); S.items.forEach(i => { i._new = i.id > maxId - 150 && !i.ak; });
    S.brands.forEach(b => S.brandBySlug.set(b.s, b));
    await API.init();
    S.cart = S.cart.filter(l => S.byId.has(l.id)); [...S.fav].forEach(id => { if (!S.byId.has(id)) S.fav.delete(id); });
    S.ready = true; renderChrome(); route();
    loadAux('brandImgs'); loadAux('catimgs');
  } catch (e) {
    $('#view').innerHTML = `<div class="wrap" style="padding-block:40px"><div class="empty"><b>${t('loadingErr')}</b><p class="num">${esc(CONFIG.phone)}</p></div></div>`;
  }
})();

/* ===== mobile helpers: tab bar search, sticky buy bar on product page ===== */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-focus-search]'); if (!a) return;
  e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); const q = $('#q'); if (q) setTimeout(() => q.focus(), 150);
});

</script>
