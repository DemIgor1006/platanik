<html lang="uk">

<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; padding: 0; }

[hidden]:not([hidden=until-found i]) { display: none !important; }
</style>
<title>PLATANIK</title>
<meta name="description" content="PLATANIK — запчастини, аксесуари, світлотехніка та пневматика для вантажівок і причепів від ТОВ «ПЛА-ТАН І К». Склади в Києві та Харкові.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black nav bar → #191919 action bar (catalog pill + search) → page on light grey with white 16px-radius cards;
   home hero sits on a dark carbon band (catalog sidebar · banner slider · promo card) → yellow (#ffd004) is the only accent → black footer.
   Type: Inter 500/600 everywhere, as in the PLATANIK Figma; codes in Inter tabular figures. */
:root {
  --bg: #f2f2f2; --surface: #ffffff; --soft: #f5f5f5; --line: #e5e5e5; --line-2: #d9d9d9;
  --ink: #0b0b0b; --ink-2: #333638; --muted: #828a8d; --faint: #aaaaaa;
  --accent: #ffd004; --accent-hover: #ffdc3d; --accent-ink: #0b0b0b; --accent-text: #a07c00; --accent-soft: #fff8d6;
  --ok: #00a14b; --ok-soft: #e6f6ec; --danger: #e30613; --danger-soft: #fbe5e5; --warn-soft: #fffbe6;
  --chrome: #000000; --chrome-2: #191919; --chrome-3: #262626; --chrome-ink: #ffffff; --chrome-muted: #9a9ea0; --chrome-line: #333333;
  --photo: #ffffff; --skeleton: #ececec; --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 2px 6px rgba(0, 0, 0, .05), 0 12px 32px rgba(0, 0, 0, .08);
  --f-body: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 16px; --r-sm: 8px; --wrap: 1600px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0f10; --surface: #18191b; --soft: #202124; --line: #2b2d30; --line-2: #36383c;
  --ink: #f1f2f3; --ink-2: #d4d6d8; --muted: #959ca0; --faint: #6e7478;
  --accent-text: #ffd004; --accent-soft: #2e2600; --ok: #34c06f; --ok-soft: #0f2a1a; --danger: #ff4d55; --danger-soft: #3a1416; --warn-soft: #2a2508;
  --photo: #ffffff; --skeleton: #24262a; --scrim: rgba(0, 0, 0, .7);
  --shadow: 0 2px 6px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e0f10; --surface: #18191b; --soft: #202124; --line: #2b2d30; --line-2: #36383c;
  --ink: #f1f2f3; --ink-2: #d4d6d8; --muted: #959ca0; --faint: #6e7478;
  --accent-text: #ffd004; --accent-soft: #2e2600; --ok: #34c06f; --ok-soft: #0f2a1a; --danger: #ff4d55; --danger-soft: #3a1416; --warn-soft: #2a2508;
  --photo: #ffffff; --skeleton: #24262a; --scrim: rgba(0, 0, 0, .7);
  --shadow: 0 2px 6px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--chrome); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
img:not([src]) { visibility: hidden; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1280px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.ico { width: 24px; height: 24px; flex: none; display: block; }
.ico.s { width: 18px; height: 18px; } .ico.xs { width: 16px; height: 16px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 100px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; line-height: 1; padding: 14px 24px; white-space: nowrap; transition: background .15s, box-shadow .15s; }
.btn:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--accent-text); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.dark { background: var(--chrome-2); color: #fff; }
.btn.line { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.line:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.btn.sm { padding: 10px 16px; font-size: 14px; }
.btn.lg { padding: 17px 32px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: default; }
.ibtn { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: var(--r-sm); border: 0; background: var(--accent); color: var(--accent-ink); flex: none; transition: background .15s, transform .1s; }
.ibtn:hover { background: var(--accent-hover); }
.ibtn:active { transform: scale(.96); }
.ibtn.in { background: var(--chrome-2); color: var(--accent); }
.ibtn.off { background: var(--soft); color: var(--muted); }
.ibtn.sm { width: 40px; height: 40px; }
.link { color: var(--accent-text); font-weight: 600; background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.heart { background: none; border: 0; padding: 4px; color: var(--muted); display: inline-grid; place-items: center; border-radius: 50%; }
.heart:hover { color: var(--ink); }
.heart.on { color: var(--danger); }
.heart.on svg path { fill: currentColor; }

/* ===== header ===== */
.nav { background: var(--chrome); color: var(--chrome-ink); }
.nav .wrap { display: flex; align-items: center; gap: 24px; min-height: 72px; padding-block: 12px; }
.logo { display: inline-flex; align-items: center; flex: none; color: var(--accent); }
.logo svg { height: 32px; width: auto; display: block; }
.nav .tel { display: flex; align-items: center; gap: 20px; font-size: 16px; font-weight: 600; }
.nav .tel a.soc { color: var(--accent); display: inline-grid; }
.nav .tel a.soc:hover { color: #fff; }
.nav .sp { flex: 1; }
.nav .right { display: flex; align-items: center; gap: 0; }
.nav .right > * + *::before { content: ""; width: 1px; height: 16px; background: #5a5a5a; margin: 0 22px; display: inline-block; vertical-align: middle; }
.nav .right > * { display: inline-flex; align-items: center; }
.lang { display: inline-flex; gap: 12px; font-size: 14px; font-weight: 600; }
.lang button { background: none; border: 0; padding: 2px 0; color: #fff; opacity: .75; }
.lang button[aria-pressed="true"] { opacity: 1; box-shadow: inset 0 -2px 0 var(--accent); }
.nbtn { position: relative; display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: #fff; padding: 4px 0; font-size: 14px; font-weight: 500; }
.nbtn:hover { color: var(--accent); }
.badge { position: absolute; top: -6px; left: 14px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #000; font: 700 11px/18px var(--f-body); text-align: center; padding: 0 5px; }
.badge:empty, .badge[data-n="0"] { display: none; }
.menu-pop { position: absolute; top: calc(100% + 10px); right: -8px; min-width: 180px; background: var(--surface); color: var(--ink); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 80; display: grid; }
.menu-pop a, .menu-pop button { text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; }
.menu-pop a:hover, .menu-pop button:hover { background: var(--soft); }
.burger { display: none; background: none; border: 0; color: #fff; padding: 6px; }

.abar { background: var(--chrome-2); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
.abar .wrap { display: flex; gap: 32px; align-items: center; padding-block: 8px; min-height: 72px; }
.catbtn { width: 300px; flex: none; height: 56px; display: inline-flex; align-items: center; gap: 12px; padding: 0 24px; border: 0; border-radius: 100px; background: var(--accent); color: #000; font-size: 16px; font-weight: 500; }
.catbtn:hover { background: var(--accent-hover); }
.search { position: relative; flex: 1; max-width: 936px; }
.search form { display: flex; align-items: center; height: 56px; background: #fff; border-radius: 100px; padding: 8px 8px 8px 24px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #0b0b0b; font-size: 16px; font-weight: 500; }
.search input::placeholder { color: #aaa; }
.search .go { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #000; display: grid; place-items: center; flex: none; }
.search:focus-within form { box-shadow: 0 0 0 3px rgba(255, 208, 4, .45); }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: var(--surface); color: var(--ink); border-radius: var(--r); box-shadow: var(--shadow); z-index: 90; overflow: hidden; max-height: min(70vh, 640px); overflow-y: auto; }
.sugg .sg-h { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 16px 6px; }
.sugg a.sg-c { display: flex; justify-content: space-between; gap: 10px; padding: 8px 16px; font-size: 14px; }
.sugg a.sg-p { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 16px; }
.sugg a.on, .sugg a:hover { background: var(--soft); }
.sugg .sg-ph { width: 56px; height: 56px; border-radius: 8px; background: var(--photo); display: grid; place-items: center; overflow: hidden; }
.sugg .sg-ph img { max-width: 52px; max-height: 52px; object-fit: contain; }
.sugg .sg-n { font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sugg .sg-m { font-size: 12px; color: var(--muted); }
.sugg .sg-pr { font-weight: 600; font-size: 14px; white-space: nowrap; }
.sugg .sg-all { display: block; text-align: center; padding: 14px; font-weight: 600; border-top: 1px solid var(--line); color: var(--accent-text); }
.sugg .sg-empty { padding: 20px 16px; color: var(--muted); font-size: 14px; }

/* mega menu */
.mega { position: absolute; left: 0; right: 0; top: 100%; z-index: 70; padding-top: 8px; }
.mega .wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.mega-in { display: contents; }
.mega .catside { background: var(--chrome-2); }
.mega .panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 24px; min-height: 528px; max-height: calc(100vh - 170px); overflow: auto; }
.mega .panel h3 { font-size: 20px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.mega .panel h3 a { font-size: 14px; color: var(--accent-text); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { display: grid; grid-template-rows: 110px auto; gap: 8px; padding: 12px; border-radius: 12px; text-align: center; font-size: 14px; line-height: 1.3; transition: background .15s; }
.tile:hover { background: var(--soft); }
.tile .tph { display: grid; place-items: center; background: var(--photo); border-radius: 10px; overflow: hidden; }
.tile .tph img { max-height: 100px; object-fit: contain; }
.tile small { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
.sublist { columns: 3 220px; column-gap: 24px; }
.sublist a { display: block; padding: 5px 0; font-size: 14px; color: var(--ink-2); break-inside: avoid; }
.sublist a:hover { color: var(--accent-text); }

/* catalog side list (dark, as in the hero) */
.catside { width: 300px; border-radius: var(--r); background: rgba(25, 25, 25, .92); color: #fff; padding: 12px 0; backdrop-filter: blur(4px); }
.catside a { display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-size: 14.5px; line-height: 1.3; min-height: 40px; }
.catside a .ico { color: var(--accent); }
.catside a .chev { margin-left: auto; color: #8a8a8a; width: 18px; height: 18px; }
.catside a:hover, .catside a.on { background: rgba(255, 255, 255, .07); color: var(--accent); }
.catside a.all { justify-content: center; color: #fff; font-weight: 600; padding-top: 12px; }

/* ===== page bits ===== */
main { min-height: 50vh; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding-block: 20px 12px; }
.crumbs a:hover { color: var(--ink); }
.crumbs .sep { opacity: .6; }
.ptitle { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 20px; }
.ptitle h1 { font-size: clamp(24px, 2.4vw, 32px); }
.card { background: var(--surface); border-radius: var(--r); }
.sec { padding-block: 32px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.sec-h h2 { font-size: clamp(22px, 2vw, 28px); }
.sec-h .more { font-size: 14px; color: var(--accent-text); font-weight: 600; }
.pager { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 100px; padding: 4px 6px; box-shadow: inset 0 0 0 1px var(--line); }
.pager button { background: none; border: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.pager button:hover { background: var(--soft); }
.pager button[disabled] { opacity: .3; }
.pager .dots { display: inline-flex; gap: 6px; }
.pager .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line-2); transition: width .2s, background .2s; }
.pager .dots i.on { width: 6px; background: var(--accent); }

/* hero */
.hero { position: relative; background-color: #0a0a0a; background-image:
  repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px),
  repeating-linear-gradient(-45deg, rgba(0,0,0,.5) 0 2px, transparent 2px 6px),
  radial-gradient(120% 90% at 70% 0%, #2a2a2a 0%, #0a0a0a 60%); color: #fff; padding-block: 32px 40px; }
.hero-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 32px; align-items: stretch; }
.hero .catside { min-height: 528px; }
.slider { position: relative; border-radius: var(--r); overflow: hidden; min-height: 528px; background: #151515; isolation: isolate; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .6s; pointer-events: none; display: grid; }
.slide.on { opacity: 1; pointer-events: auto; }
.slide img.full { width: 100%; height: 100%; object-fit: cover; }
.sl-dots { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 8px; z-index: 3; }
.sl-dots button { width: 10px; height: 10px; border-radius: 5px; border: 0; background: rgba(255,255,255,.45); padding: 0; transition: width .25s, background .25s; }
.sl-dots button.on { width: 28px; background: var(--accent); }
.sl-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; }
.sl-arrow:hover { background: rgba(0,0,0,.7); }
.sl-arrow.prev { left: 14px; } .sl-arrow.next { right: 14px; }
/* composed banners (built from real catalogue photos) */
.bn { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 12px; padding: 48px 56px 64px; height: 100%; color: #fff; overflow: hidden; }
.bn .eb { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
.bn h2 { font-size: clamp(28px, 3vw, 44px); font-weight: 700; line-height: 1.08; letter-spacing: -.02em; text-transform: uppercase; }
.bn p { color: #c9c9c9; margin-top: 14px; max-width: 42ch; font-size: 15.5px; }
.bn .btn { margin-top: 28px; background: #fff; color: #000; }
.bn .btn:hover { background: var(--accent); }
.bn .pics { position: relative; height: 100%; min-height: 300px; }
.bn .pics span { position: absolute; display: grid; place-items: center; background: #fff; border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.45); overflow: hidden; }
.bn .pics span img { max-width: 92%; max-height: 92%; object-fit: contain; }
.bn .pics span:nth-child(1) { width: 62%; aspect-ratio: 1; right: 4%; top: 2%; transform: rotate(3deg); }
.bn .pics span:nth-child(2) { width: 44%; aspect-ratio: 1; left: 0; bottom: 4%; transform: rotate(-5deg); }
.bn .pics span:nth-child(3) { width: 34%; aspect-ratio: 1; right: 0; bottom: 0; transform: rotate(6deg); }
.bn.y { background: radial-gradient(90% 120% at 100% 0%, #3a3000 0%, #121212 55%); }
.bn.y h2 em { font-style: normal; color: var(--accent); }
.bn.r { background: radial-gradient(90% 120% at 100% 100%, #3d0d10 0%, #121212 55%); }
.bn.g { background: radial-gradient(90% 120% at 0% 100%, #2b2b2b 0%, #101010 60%); }
.promo { border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; min-height: 528px; }
.promo .ptag { display: flex; gap: 4px; flex-wrap: wrap; }
.promo .ptag span { background: var(--accent); color: #000; font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
.promo .pph { flex: 1; display: grid; place-items: center; background: var(--photo); border-radius: 12px; min-height: 200px; }
.promo .pph img { max-height: 240px; object-fit: contain; }
.promo .pn { font-size: 15px; line-height: 1.4; }
.promo .pp { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.promo .pp b { font-size: 22px; }
.benefits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 32px; padding-inline: 0; }
.benefit { display: flex; gap: 20px; align-items: center; padding: 24px; border-radius: var(--r); background: rgba(38, 38, 38, .85); }
.benefit .bi { width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: #000; display: grid; place-items: center; flex: none; }
.benefit b { display: block; font-size: 17px; color: var(--accent); margin-bottom: 6px; }
.benefit span { font-size: 14px; color: #d6d6d6; line-height: 1.45; }

/* brands strip */
.brands { display: flex; align-items: center; gap: 0; padding: 12px 24px; overflow-x: auto; scrollbar-width: none; }
.brands::-webkit-scrollbar { display: none; }
.brands a.bl { flex: none; width: 128px; height: 90px; display: grid; place-items: center; padding: 6px 12px; border-right: 1px solid var(--line); }
.brands a.bl img { max-width: 100%; max-height: 70px; object-fit: contain; filter: grayscale(.15); transition: filter .2s, transform .2s; }
.brands a.bl:hover img { filter: none; transform: scale(1.04); }
.brands a.bl span { font-weight: 700; font-size: 14px; letter-spacing: .02em; text-align: center; }
.brands a.all { flex: none; padding: 0 24px; font-weight: 600; color: var(--accent-text); white-space: nowrap; }
.brands .lg { background: #fff; border-radius: 10px; }

/* product card */
.row-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 4 * 32px) / 5); gap: 32px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.row-scroll::-webkit-scrollbar { display: none; }
.row-scroll > * { scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 24px; }
.pc { position: relative; background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .2s; min-width: 0; }
.pc:hover { box-shadow: var(--shadow); z-index: 2; }
.pc .ph { display: grid; place-items: center; aspect-ratio: 1; max-height: 182px; width: 100%; margin: 0 auto; background: var(--photo); border-radius: 12px; overflow: hidden; }
.pc .ph img { width: 100%; height: 100%; object-fit: contain; transition: transform .3s; }
.pc:hover .ph img { transform: scale(1.04); }

}
const whName = i => { const w = S.wh[i]; if (S.lang !== 'ru') return w; return { 'Київ': 'Киев', 'Харків': 'Харьков' }[w] || w; };
function bestWh(it) { let b = -1, bn = -1; it._st.forEach((s, i) => { if (s.n > bn) { bn = s.n; b = i; } }); return bn > 0 ? b : 0; }

/* ===== cart / fav / user ===== */
function saveAll() { store.set('cart', S.cart); store.set('fav', [...S.fav]); store.set('user', S.user); store.set('users', S.users); store.set('orders', S.orders); store.set('tpls', S.tpls); store.set('reviews', S.reviews); store.set('recent', S.recent); store.set('view', S.view); store.set('lang', S.lang); }
function loadAll() {
  S.lang = store.get('lang', 'ua') === 'ru' ? 'ru' : 'ua';
  S.cart = (store.get('cart', []) || []).filter(l => l && l.id && l.q > 0);
  S.fav = new Set(store.get('fav', []) || []);
  S.user = store.get('user', null); S.users = store.get('users', {}) || {};
  S.orders = store.get('orders', []) || []; S.tpls = store.get('tpls', []) || []; S.reviews = store.get('reviews', {}) || {}; S.recent = store.get('recent', []) || [];
  S.view = store.get('view', 'grid') === 'table' ? 'table' : 'grid';
  try { S.q = sessionStorage.getItem('pl-q') || ''; } catch (e) {}
}
const cartLines = () => S.cart.map(l => ({ ...l, it: S.byId.get(l.id) })).filter(l => l.it);
const cartQty = () => cartLines().reduce((a, l) => a + l.q, 0);
const cartSum = () => cartLines().reduce((a, l) => a + priceOf(l.it) * l.q, 0);
function addToCart(id, q = 1, wh) {
  const it = S.byId.get(id); if (!it) return;
  q = Math.max(it.mo || 1, Math.min(9999, parseInt(q, 10) || 1));
  if (wh == null) wh = bestWh(it);
  const ex = S.cart.find(l => l.id === id && l.wh === wh);
  if (ex) ex.q += q; else S.cart.push({ id, wh, q });
  saveAll(); updateBadges(); refreshBuyButtons(id);
  toast(t('added'), `<a href="#cart" data-open-cart>${t('open')}</a>`);
}
function toggleFav(id) {
  if (S.fav.has(id)) { S.fav.delete(id); toast(t('favRemoved')); } else { S.fav.add(id); toast(t('favAdded'), `<a href="#favorites">${t('open')}</a>`); }
  saveAll(); updateBadges();
  $$(`[data-fav="${id}"]`).forEach(b => { b.classList.toggle('on', S.fav.has(id)); b.setAttribute('aria-pressed', S.fav.has(id)); });
}
function updateBadges() {
  const cq = cartQty();
  $$('[data-badge="cart"]').forEach(b => { b.textContent = cq || ''; b.dataset.n = cq; });
  $$('[data-badge="fav"]').forEach(b => { b.textContent = S.fav.size || ''; b.dataset.n = S.fav.size; });
  $$('[data-cart-label]').forEach(e => { e.textContent = cq ? moneyTxt(cartSum()) : t('cart'); });
}
function refreshBuyButtons(id) {
  const inC = S.cart.some(l => l.id === id);
  $$(`[data-add="${id}"]`).forEach(b => { if (b.classList.contains('ibtn')) b.classList.toggle('in', inC); else if (b.dataset.big) b.innerHTML = `${ic('cart')} ${inC ? t('inCart') : t('toCart')}`; });
}

/* ===== small UI ===== */
function toast(msg, extra = '') {
  const el = $('#toast'); el.innerHTML = `<span>${esc(msg)}</span>${extra}`; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2800);
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg || t('copied')); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); toast(ok ? (msg || t('copied')) : (S.lang === 'ru' ? 'Не удалось скопировать — выделите текст вручную' : 'Не вдалося скопіювати — виділіть текст вручну')); return ok; }
}
function modal(html, cls = '') {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="${cls}" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) closeModal(); });
  document.body.appendChild(m); document.body.style.overflow = 'hidden';
  const f = m.querySelector('input, select, button:not([data-close])'); if (f) setTimeout(() => f.focus(), 30);
  return m;
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); document.body.style.overflow = ''; }

const crumbs = list => `<nav class="crumbs" aria-label="breadcrumbs"><a href="#home" aria-label="${t('home')}">${ic('home', 'xs')}</a>${list.map(([h, l]) => `<span class="sep">${ic('chr', 'xs')}</span>${h ? `<a href="#${h}">${esc(l)}</a>` : `<span>${esc(l)}</span>`}`).join('')}</nav>`;

  const out = [], seen = new Set();
  const tops = topCats().filter(c => c.k !== 'akciya');
  for (let round = 0; out.length < 15 && round < 6; round++) for (const c of tops) {

}

const blankF = () => ({ pmin: null, pmax: null, mk: new Set(), wh: new Set(), av: '' });
function ensureL(key, base) {
  if (!S.L || S.L.key !== key) S.L = { key, f: blankF(), sort: 'def', per: 24, page: 1 };
  S.L.base = base; return S.L;
}
function matchF(it, f, skip) {
  if (skip !== 'mk' && f.mk.size && !f.mk.has(it.b || '—')) return false;
  if (skip !== 'wh' && f.wh.size && ![...f.wh].some(i => it._st[i] && it._st[i].n > 0)) return false;
  if (skip !== 'av' && f.av === 'in' && !it._av) return false;
  if (skip !== 'av' && f.av === 'out' && it._av) return false;
  if (skip !== 'p') { const p = priceOf(it); if (f.pmin != null && p < f.pmin) return false; if (f.pmax != null && p > f.pmax) return false; }
  return true;
}
function sortList(list, sort, scored) {
  const a = list.slice();
  if (sort === 'cheap') a.sort((x, y) => priceOf(x) - priceOf(y));
  else if (sort === 'dear') a.sort((x, y) => priceOf(y) - priceOf(x));
  else if (sort === 'name') a.sort((x, y) => nm(x).localeCompare(nm(y), 'uk'));
  else if (sort === 'new') a.sort((x, y) => y.id - x.id);
  else if (sort === 'code') a.sort((x, y) => (x.cc || '~').localeCompare(y.cc || '~', 'uk', { numeric: true }));
  else if (scored) a.sort((x, y) => (y._sc - x._sc) || (y._av - x._av));
  else a.sort((x, y) => (y._av - x._av) || ((y.i != null) - (x.i != null)) || (y._tot - x._tot));
  return a;
}

function placeOrder(o) {

function sanitize(html) {
  const d = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html');
  d.querySelectorAll('script,style,iframe,object,embed,form,input,button,select,textarea,img,svg,video,link,meta,noscript,.breadcrumb,h1').forEach(e => e.remove());
  d.querySelectorAll('*').forEach(e => { [...e.attributes].forEach(a => { if (!['href', 'colspan', 'rowspan'].includes(a.name)) e.removeAttribute(a.name); }); if (e.tagName === 'A') { const h = e.getAttribute('href') || ''; if (!/^https?:/.test(h)) e.removeAttribute('href'); else { e.setAttribute('target', '_blank'); e.setAttribute('rel', 'noopener'); } } });
  d.querySelectorAll('table').forEach(tb => { const w = d.createElement('div'); w.className = 'tw'; tb.replaceWith(w); w.appendChild(tb); });
  const root = d.body.firstChild;
  root.querySelectorAll('div, span').forEach(e => { if (!e.textContent.trim() && !e.querySelector('table')) e.remove(); });
  return root.innerHTML.replace(/(<br>\s*){3,}/g, '<br><br>');
}

/* ===== router ===== */
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  openMega(false); closeModal(); openFilters(false); closeSugg(); closeUserMenu();
  if (h !== 'order-done' && S.done && h !== 'cart') S.done = null;
  let m;
  if (h === 'home') viewHome();
  else if ((m = h.match(/^c(\d+)$/))) viewCategory(+m[1]);
  else if ((m = h.match(/^p(\d+)$/))) viewProduct(+m[1]);
  else if ((m = h.match(/^b-([a-z0-9-]+)$/))) viewBrand(m[1]);
  else if ((m = h.match(/^news-(\d+)$/))) viewNews(+m[1]);
  else if (h === 'catalog') viewCatalog();
  else if (h === 'search') viewSearch();
  else if (h === 'cart') viewCart();
  else if (h === 'checkout') viewCheckout();
  else if (h === 'order-done') viewDone();
  else if (h === 'favorites') viewFavorites();
  else if (h === 'brands') viewBrands();
  else if (h === 'new') viewNew();
  else if (h === 'news') viewNews();
  else if (h === 'login') viewAuth('login');
  else if (h === 'register') viewAuth('register');
  else if (h === 'account') viewAccount();
  else if (h === 'account-orders') viewOrders();
  else if (h === 'account-invoices') viewInvoices();
  else if (h === 'account-delivery') viewTpls();
  else if (INFO.some(r => r[0] === h)) viewInfo(h);
  else viewNotFound();
  if (S.routeKey !== h) window.scrollTo(0, 0);
  S.routeKey = h;
  $('#view').focus({ preventScroll: true });
}

/* ===== search suggestions ===== */
let sugIdx = -1;
function closeSugg() { const s = $('#sugg'); if (s) s.hidden = true; }
function renderSugg(v) {
  const box = $('#sugg'); const q = parseQ(v);
  if (!q.raw || q.raw.length < 2) { box.hidden = true; return; }
  const hits = S.items.map(it => [it, score(it, q)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1] || (b[0]._av - a[0]._av));
  const ql = q.raw.toLowerCase();
  const cats = S.cats.filter(c => catItems(c).length && (c.n.toLowerCase().includes(ql) || (c.r || '').toLowerCase().includes(ql) || q.toks.every(k => (c.n + ' ' + (c.r || '')).toLowerCase().includes(k.w)))).slice(0, 4);
  if (!hits.length && !cats.length) { box.innerHTML = `<div class="sg-empty">${t('nothingT')}. <a class="link" href="#contacts">${t('contactUs')}</a></div>`; box.hidden = false; return; }
  box.innerHTML = (cats.length ? `<div class="sg-h">${t('cats')}</div>${cats.map(c => `<a class="sg-c" href="#c${c.id}"><span>${esc(catPath(c).map(cn).join(' › '))}</span><small class="muted">${catItems(c).length}</small></a>`).join('')}` : '')
    + (hits.length ? `<div class="sg-h">${t('goods')}</div>${hits.slice(0, 6).map(([it]) => `<a class="sg-p" href="#p${it.id}"><span class="sg-ph">${pimg(it)}</span><span><span class="sg-n">${esc(nm(it))}</span><span class="sg-m">${esc([it.b, it.cc].filter(Boolean).join(' · '))}</span></span><span class="sg-pr">${moneyTxt(priceOf(it))}</span></a>`).join('')}<a class="sg-all" href="#search" data-sall>${t('allResults')}: ${fmtN(hits.length)} →</a>` : '');
  box.hidden = false; sugIdx = -1;
}
function goSearch(v) { S.q = String(v || '').trim(); try { sessionStorage.setItem('pl-q', S.q); } catch (e) {} S.L = null; closeSugg(); if (location.hash === '#search') route(); else location.hash = 'search'; }
function closeUserMenu() { const p = $('#umenu'); if (p) p.remove(); $('#userbtn')?.setAttribute('aria-expanded', 'false'); }

/* ===== global events ===== */
function bindGlobal() {
  document.addEventListener('click', e => {
    const tg = e.target;
    const q = tg.closest('[data-qd]'); if (q) { const inp = $('input', q.closest('[data-qbox]')); inp.value = Math.max(+inp.min || 1, (parseInt(inp.value, 10) || 1) + +q.dataset.qd); inp.dispatchEvent(new Event('change', { bubbles: true })); return; }
    const add = tg.closest('[data-add]'); if (add) { const qi = add.dataset.qty && document.getElementById(add.dataset.qty); addToCart(+add.dataset.add, qi ? qi.value : undefined); return; }
    const fav = tg.closest('[data-fav]'); if (fav) { toggleFav(+fav.dataset.fav); return; }
    const oc = tg.closest('[data-oneclick]'); if (oc) { oneClick(+oc.dataset.oneclick); return; }
    const ask = tg.closest('[data-ask]'); if (ask) { oneClick(+ask.dataset.ask, 'ask'); return; }
    const cp = tg.closest('[data-copy]'); if (cp) { copyText(cp.dataset.copy, `${t('copied')}: ${cp.dataset.copy}`); return; }
    const oc2 = tg.closest('[data-open-cart]'); if (oc2 && !matchMedia('(max-width: 860px)').matches && location.hash !== '#cart' && location.hash !== '#checkout') { e.preventDefault(); $('#toast').classList.remove('on'); cartModal(); return; }
    const sr = tg.closest('[data-search]'); if (sr) { e.preventDefault(); goSearch(sr.dataset.search); return; }
    const lg = tg.closest('[data-lang]'); if (lg) { S.lang = lg.dataset.lang; document.documentElement.lang = S.lang === 'ru' ? 'ru' : 'uk'; saveAll(); renderChrome(); route(); return; }
    if (tg.closest('#catbtn')) { openMega(!S.megaOpen); return; }
    if (tg.closest('#burger')) { openMobileMenu(); return; }
    if (tg.closest('#userbtn')) { toggleUserMenu(); return; }
    if (S.megaOpen && !tg.closest('.mega')) openMega(false);
    if (!tg.closest('.search')) closeSugg();
    if (!tg.closest('.user-w')) closeUserMenu();
    if (tg.closest('#totop')) window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.addEventListener('submit', e => { if (e.target.id === 'sform') { e.preventDefault(); const links = $$('#sugg a'); if (sugIdx >= 0 && links[sugIdx] && !links[sugIdx].hasAttribute('data-sall')) { location.hash = links[sugIdx].getAttribute('href').slice(1); closeSugg(); } else goSearch($('#q').value); $('#q').blur(); } });
  document.addEventListener('input', e => { if (e.target.id === 'q') renderSugg(e.target.value); });
  document.addEventListener('focusin', e => { if (e.target.id === 'q' && e.target.value) renderSugg(e.target.value); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); openMega(false); closeSugg(); openFilters(false); closeUserMenu(); return; }
    if (e.target.id === 'q' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { const links = $$('#sugg a'); if ($('#sugg').hidden || !links.length) return; e.preventDefault(); sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length; links.forEach((a, i) => a.classList.toggle('on', i === sugIdx)); links[sugIdx].scrollIntoView({ block: 'nearest' }); }
  });
  document.addEventListener('click', e => { const a = e.target.closest('#sugg a'); if (a && a.hasAttribute('data-sall')) { e.preventDefault(); goSearch($('#q').value); } else if (a) closeSugg(); }, true);
  window.addEventListener('scroll', () => { $('#totop').classList.toggle('on', window.scrollY > 700); }, { passive: true });
  window.addEventListener('hashchange', route);
}
function toggleUserMenu() {
  if ($('#umenu')) return closeUserMenu();
  const w = $('.user-w'); const p = document.createElement('div'); p.className = 'menu-pop'; p.id = 'umenu';
  p.innerHTML = S.user ? `<a href="#account">${t('profile')}</a><a href="#account-orders">${t('myOrders')}</a>${isWholesale() ? `<a href="#account-invoices">${t('invoices')}</a><a href="#account-delivery">${t('delivTpl')}</a>` : ''}<a href="#favorites">${t('favorites')}</a><button type="button" id="ulogout">${t('logout')}</button>` : `<a href="#login">${t('login')}</a><a href="#register">${t('register')}</a>`;
  w.appendChild(p); $('#userbtn').setAttribute('aria-expanded', 'true');
  const lo = $('#ulogout'); if (lo) lo.addEventListener('click', () => { S.user = null; saveAll(); renderChrome(); location.hash = 'home'; });
}
function openMobileMenu() {
  const ru = S.lang === 'ru';
  const m = modal(`<div class="mh"><a class="logo" href="#home" data-close style="color:var(--accent)">${LOGO()}</a><button type="button" data-close aria-label="${t('close')}">${ic('x')}</button></div>
    <div class="mb mmenu"><div class="lang" style="gap:16px"><button type="button" data-lang="ua" aria-pressed="${S.lang === 'ua'}" style="color:var(--ink)">UA</button><button type="button" data-lang="ru" aria-pressed="${S.lang === 'ru'}" style="color:var(--ink)">RU</button></div>
      <nav class="mm-cats">${topCats().map(c => `<a href="#c${c.id}" data-close>${ic(CAT_ICON[c.k] || 'cParts', 's')} ${esc(cn(c))}</a>`).join('')}</nav>
      <nav class="mm-links"><a href="${S.user ? '#account' : '#login'}" data-close>${ic('user', 's')} ${S.user ? t('cabinet') : t('login')}</a><a href="#favorites" data-close>${ic('heart', 's')} ${t('favorites')}</a><a href="#brands" data-close>${t('brandsT')}</a><a href="#delivery" data-close>${t('payDelivery')}</a><a href="#warranty" data-close>${t('warranty')}</a><a href="#returns" data-close>${t('returns')}</a><a href="#dropshipping" data-close>${t('dropshipping')}</a><a href="#about" data-close>${t('about')}</a><a href="#contacts" data-close>${t('fContacts')}</a></nav>
      <div class="mm-contact"><a href="tel:${CONFIG.phoneTel}"><b class="num">${esc(CONFIG.phone)}</b></a><span class="muted">${esc(loc(CONFIG.hoursShort))}</span><div style="display:flex;gap:10px"><a class="btn sm" href="https://t.me/${CONFIG.telegram}" target="_blank" rel="noopener">${ic('telegram', 's')} Telegram</a><a class="btn line sm" href="viber://chat?number=%2B${CONFIG.viber.replace(/\D/g, '')}">${ic('viber', 's')} Viber</a></div></div></div>`, 'msheet');
  m.classList.add('side');
}

/* ===== boot ===== */
(async function boot() {
  loadAll(); document.documentElement.lang = S.lang === 'ru' ? 'ru' : 'uk';
  renderChrome(); bindGlobal();
  $('#view').innerHTML = `<div class="wrap" style="padding-block:24px"><div class="grid">${'<div class="sk"></div>'.repeat(10)}</div></div>`;
  try {
    const r = await fetch('data/catalog.json'); if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    S.wh = d.wh; S.cats = d.cats; S.items = d.items; S.brands = d.brands;
    S.cats.forEach(c => { S.catById.set(c.id, c); S.catByKey.set(c.k, c); c._own = []; });
    S.items.forEach(it => { S.byId.set(it.id, it); (it.c || []).forEach(cid => { const c = S.catById.get(cid); if (c) c._own.push(it.id); }); });
    S.items.forEach(indexItem);
    const maxId = Math.max(...S.items.map(i => i.id)); S.items.forEach(i => { i._new = i.id > maxId - 150 && !i.ak; });
    S.brands.forEach(b => S.brandBySlug.set(b.s, b));
    S.cart = S.cart.filter(l => S.byId.has(l.id)); [...S.fav].forEach(id => { if (!S.byId.has(id)) S.fav.delete(id); });
    S.ready = true; renderChrome(); route();
    loadAux('brandImgs');
  } catch (e) {
    $('#view').innerHTML = `<div class="wrap" style="padding-block:40px"><div class="empty"><b>${t('loadingErr')}</b><p class="num">${esc(CONFIG.phone)}</p></div></div>`;
  }
})();

</script>
